# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build the site
        run: npm run build
      - name: Release gate
        # `npm run test:ci` is the lean release gate: the build output, a
        # representative set of pages, navigation, internal links and images,
        # core interactions and accessibility on key pages. It blocks on things
        # a visitor would notice or that stop the site being published, never on
        # a machine's rendering of it — screenshot comparison, font
        # rasterisation and the exhaustive matrices are optional QA
        # (`npm test`), because Ubuntu and Windows never paint identical pixels.
        run: npm run test:ci
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the generated site is published; the image archive, data files,
          # tooling, tests and reports stay in the repository.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
